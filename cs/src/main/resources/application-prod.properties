# Production profile (Render): self-contained in-memory database, reseeded on every start.
# The H2 web console stays disabled — it must never be reachable on a public host.
server.port=${PORT:8080}
spring.application.name=edutrack

spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Honour X-Forwarded-* headers from Render's proxy
server.forward-headers-strategy=framework
